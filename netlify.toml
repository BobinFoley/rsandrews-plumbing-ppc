[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 301

# Legacy HVAC service slug redirects to clean plumbing routes
[[redirects]]
from = "/24-7-emergency-ac-repair/*"
to = "/24-7-emergency-plumbing/"
status = 301

[[redirects]]
from = "/heating-and-air/*"
to = "/plumbing-services/"
status = 301

[[redirects]]
from = "/new-hvac-system-financing/*"
to = "/plumbing-financing/"
status = 301

[[redirects]]
from = "/we-repair-all-hvac-brands/*"
to = "/plumbing-brands-serviced/"
status = 301

# Legacy HVAC blog post redirects to plumbing blog posts
[[redirects]]
from = "/blog/5-signs-your-ac-needs-emergency-repair/*"
to = "/blog/5-warning-signs-you-need-an-emergency-plumber/"
status = 301

[[redirects]]
from = "/blog/heat-pump-vs-furnace-georgia-guide/*"
to = "/blog/tankless-vs-tank-water-heaters-georgia-guide/"
status = 301

[[redirects]]
from = "/blog/how-often-should-you-service-your-hvac/*"
to = "/blog/how-often-should-you-inspect-your-home-plumbing/"
status = 301

[[redirects]]
from = "/blog/understanding-hvac-financing-options/*"
to = "/blog/understanding-plumbing-financing-options/"
status = 301

